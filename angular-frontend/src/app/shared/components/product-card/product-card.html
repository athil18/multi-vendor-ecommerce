<div class="glass-card group flex flex-col justify-between overflow-hidden rounded-2xl border border-white/5 bg-surface-container-low transition-all duration-300 hover:border-primary/30 hover:shadow-2xl">
  
  <a [routerLink]="['/products', product.slug || product._id]" class="block relative aspect-square w-full overflow-hidden bg-surface-container-lowest/80 p-4">
    <!-- Category Badge -->
    <div class="absolute left-3 top-3 z-10">
      <span class="badge-pill bg-surface/80 backdrop-blur-md text-[10px] text-on-surface border border-white/10">
        {{ categoryName }}
      </span>
    </div>

    <!-- Stock / Rating Badge -->
    <div *ngIf="product.averageRating" class="absolute right-3 top-3 z-10 flex items-center gap-1 rounded-full bg-surface/80 backdrop-blur-md px-2 py-0.5 text-[10px] font-bold text-amber-400 border border-white/10">
      <lucide-icon [img]="StarIcon" class="h-3 w-3 fill-amber-400"></lucide-icon>
      <span>{{ product.averageRating.toFixed(1) }}</span>
    </div>

    <!-- Product Image -->
    <img 
      [src]="imageUrl" 
      [alt]="product.name" 
      class="h-full w-full object-contain transition-transform duration-500 group-hover:scale-110"
      loading="lazy"
    />
  </a>

  <!-- Details -->
  <div class="flex flex-1 flex-col justify-between p-5 gap-3">
    <div class="flex flex-col gap-1">
      <span *ngIf="product.brandName" class="text-[11px] font-semibold text-primary uppercase tracking-wider">{{ product.brandName }}</span>
      <a [routerLink]="['/products', product.slug || product._id]" class="line-clamp-2 text-sm font-bold text-on-surface hover:text-primary transition-colors">
        {{ product.name }}
      </a>
      <p class="text-xs text-on-surface-variant line-clamp-1 mt-0.5">
        {{ product.description }}
      </p>
    </div>

    <!-- Price and Quick Add -->
    <div class="flex items-center justify-between border-t border-outline-variant/15 pt-3 mt-1">
      <div class="flex flex-col">
        <span class="text-[10px] text-on-surface-variant uppercase font-medium">Price</span>
        <span class="font-geist text-lg font-bold text-on-surface">${{ product.basePrice.toFixed(2) }}</span>
      </div>

      <button 
        (click)="addToCart($event)"
        [ngClass]="added ? 'bg-tertiary text-on-tertiary' : 'bg-primary text-on-primary hover:bg-primary-container hover:scale-105'"
        class="flex h-9 items-center gap-1.5 rounded-xl px-3.5 text-xs font-bold transition-all shadow-md active:scale-95"
      >
        <lucide-icon [img]="added ? ShoppingBagIcon : PlusIcon" class="h-3.5 w-3.5"></lucide-icon>
        <span>{{ added ? 'Added!' : 'Add' }}</span>
      </button>
    </div>

  </div>

</div>
