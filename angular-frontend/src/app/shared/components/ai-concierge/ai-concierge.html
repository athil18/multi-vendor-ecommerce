<!-- Floating AI Concierge Launcher -->
<div class="fixed bottom-6 right-6 z-40">
  
  <!-- Trigger Button -->
  <button 
    *ngIf="!isOpen()"
    (click)="toggleOpen()"
    class="flex items-center gap-2.5 rounded-full bg-gradient-to-tr from-primary to-primary-container px-4 py-3 text-on-primary shadow-2xl ambient-shadow-primary transition-transform hover:scale-105 active:scale-95"
  >
    <div class="flex h-6 w-6 items-center justify-center rounded-full bg-white/20 text-on-primary">
      <lucide-icon [img]="SparklesIcon" class="h-4 w-4 animate-spin"></lucide-icon>
    </div>
    <span class="text-xs font-bold font-geist">Nexus AI Agent</span>
  </button>

  <!-- Expanded AI Concierge Panel -->
  <div 
    *ngIf="isOpen()"
    class="flex flex-col w-[360px] sm:w-[400px] h-[520px] rounded-3xl border border-outline-variant/30 bg-surface shadow-2xl backdrop-blur-2xl overflow-hidden"
  >
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-outline-variant/20 bg-surface-container-high p-4">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-primary text-on-primary shadow-sm">
          <lucide-icon [img]="SparklesIcon" class="h-4.5 w-4.5"></lucide-icon>
        </div>
        <div>
          <h3 class="font-geist text-xs font-bold text-on-surface">Nexus Multi-Agent AI</h3>
          <p class="text-[10px] text-tertiary flex items-center gap-1">
            <span class="h-1.5 w-1.5 rounded-full bg-tertiary animate-pulse"></span>
            500+ Specialized Agents Online
          </p>
        </div>
      </div>

      <button 
        (click)="toggleOpen()"
        class="rounded-lg p-1.5 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface transition-colors"
      >
        <lucide-icon [img]="XIcon" class="h-4.5 w-4.5"></lucide-icon>
      </button>
    </div>

    <!-- Messages Body -->
    <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3.5 bg-surface-container-lowest/50">
      <div 
        *ngFor="let msg of messages()"
        [ngClass]="msg.sender === 'user' ? 'items-end' : 'items-start'"
        class="flex flex-col gap-1 max-w-[85%]"
      >
        <div 
          [ngClass]="msg.sender === 'user' ? 'bg-primary text-on-primary rounded-2xl rounded-tr-sm ml-auto' : 'glass-panel text-on-surface rounded-2xl rounded-tl-sm border border-white/5'"
          class="p-3 text-xs leading-relaxed"
        >
          <p>{{ msg.text }}</p>

          <!-- Suggested Action Chips -->
          <div *ngIf="msg.suggestedActions && msg.suggestedActions.length > 0" class="flex flex-wrap gap-1.5 mt-2.5 pt-2 border-t border-outline-variant/20">
            <button 
              *ngFor="let act of msg.suggestedActions"
              (click)="handleAction(act.action)"
              class="rounded-lg bg-surface-container px-2.5 py-1 text-[10px] font-semibold text-primary hover:bg-surface-variant transition-colors"
            >
              {{ act.label }}
            </button>
          </div>
        </div>

        <span class="text-[9px] text-on-surface-variant/60 px-1 font-mono">
          {{ msg.timestamp }}
        </span>
      </div>

      <div *ngIf="isTyping()" class="flex items-center gap-1.5 p-2 text-xs text-on-surface-variant">
        <lucide-icon [img]="BotIcon" class="h-4 w-4 text-primary animate-bounce"></lucide-icon>
        <span class="text-[11px]">Consulting multi-agent reasoning cluster...</span>
      </div>
    </div>

    <!-- Input Footer -->
    <div class="border-t border-outline-variant/20 bg-surface-container-high p-3">
      <form (submit)="sendMessage(); $event.preventDefault()" class="flex items-center gap-2">
        <input 
          type="text" 
          placeholder="Ask anything about orders, products, or vendors..."
          [ngModel]="userInput()"
          (ngModelChange)="userInput.set($event)"
          name="chatInput"
          class="flex-1 rounded-xl border border-outline-variant/30 bg-surface-container-low px-3.5 py-2 text-xs text-on-surface focus:border-primary focus:outline-none"
        />
        <button 
          type="submit" 
          [disabled]="!userInput().trim()"
          class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-on-primary hover:scale-105 transition-all disabled:opacity-40"
        >
          <lucide-icon [img]="SendIcon" class="h-4 w-4"></lucide-icon>
        </button>
      </form>
    </div>

  </div>

</div>
