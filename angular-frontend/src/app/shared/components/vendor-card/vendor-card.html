<div class="glass-panel group relative flex flex-col justify-between overflow-hidden rounded-2xl border border-white/5 p-6 transition-all duration-300 hover:border-primary/40 hover:shadow-2xl">
  
  <div class="flex flex-col gap-4">
    <!-- Header: Logo & Verified Badge -->
    <div class="flex items-start justify-between">
      <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary-container/20 text-primary border border-primary/20 font-geist font-bold text-lg">
        <img *ngIf="store.logo" [src]="store.logo" [alt]="store.name" class="h-full w-full rounded-xl object-cover" />
        <span *ngIf="!store.logo">{{ store.name.charAt(0) }}</span>
      </div>

      <div class="flex items-center gap-1.5 rounded-full bg-surface-container px-2.5 py-1 text-[11px] font-semibold text-tertiary border border-white/5">
        <lucide-icon [img]="CheckCircleIcon" class="h-3.5 w-3.5"></lucide-icon>
        <span>Verified</span>
      </div>
    </div>

    <!-- Info -->
    <div class="flex flex-col gap-1">
      <h3 class="font-geist text-base font-bold text-on-surface group-hover:text-primary transition-colors">
        {{ store.name }}
      </h3>
      <p class="text-xs text-on-surface-variant line-clamp-2 leading-relaxed">
        {{ store.description }}
      </p>
    </div>
  </div>

  <!-- Stats footer -->
  <div class="mt-6 flex items-center justify-between border-t border-outline-variant/15 pt-4 text-xs text-on-surface-variant">
    <div class="flex items-center gap-1">
      <lucide-icon [img]="StarIcon" class="h-3.5 w-3.5 fill-amber-400 text-amber-400"></lucide-icon>
      <span class="font-bold text-on-surface">{{ store.rating || 4.9 }}</span>
      <span class="text-[11px] opacity-70">Rating</span>
    </div>

    <div class="flex items-center gap-1">
      <lucide-icon [img]="PackageIcon" class="h-3.5 w-3.5 text-primary"></lucide-icon>
      <span class="font-bold text-on-surface">{{ store.productCount || 24 }}</span>
      <span class="text-[11px] opacity-70">Products</span>
    </div>
  </div>

</div>
