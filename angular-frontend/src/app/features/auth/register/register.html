<div class="relative min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-lg glass-panel-luxury p-8 sm:p-10 rounded-3xl shadow-2xl relative z-10 flex flex-col gap-6">
    
    <!-- Header -->
    <div class="flex flex-col items-center text-center gap-2">
      <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-primary to-primary-container text-on-primary shadow-xl font-geist font-extrabold text-xl">
        N
      </div>
      <h1 class="font-geist text-2xl sm:text-3xl font-extrabold text-on-surface tracking-tight">Create your Account</h1>
      <p class="text-xs text-on-surface-variant max-w-xs">Join Nexus as an authentic customer or launch an independent artisan storefront.</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage()" class="rounded-xl bg-error/10 border border-error/20 p-3.5 text-xs text-error flex items-center gap-2">
      <lucide-icon [img]="ShieldCheckIcon" class="h-4 w-4 text-error flex-shrink-0"></lucide-icon>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Register Form -->
    <form (submit)="handleRegister(); $event.preventDefault()" class="flex flex-col gap-5">
      
      <!-- Role Toggle Tabs -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-on-surface-variant">Select Account Role</label>
        <div class="grid grid-cols-2 gap-3 p-1 rounded-2xl bg-surface-container-low border border-outline-variant/30">
          <button 
            type="button"
            (click)="role.set('customer')"
            [ngClass]="role() === 'customer' ? 'bg-primary text-on-primary shadow-md font-bold' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container'"
            class="rounded-xl p-3 text-xs transition-all flex flex-col items-center justify-center gap-1 cursor-pointer"
          >
            <div class="flex items-center gap-1.5">
              <lucide-icon [img]="UserIcon" class="h-4 w-4"></lucide-icon>
              <span>Buyer Account</span>
            </div>
            <span class="text-[10px] opacity-80 font-normal">Escrow Protection & Tracking</span>
          </button>

          <button 
            type="button"
            (click)="role.set('seller')"
            [ngClass]="role() === 'seller' ? 'bg-primary text-on-primary shadow-md font-bold' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container'"
            class="rounded-xl p-3 text-xs transition-all flex flex-col items-center justify-center gap-1 cursor-pointer"
          >
            <div class="flex items-center gap-1.5">
              <lucide-icon [img]="StoreIcon" class="h-4 w-4"></lucide-icon>
              <span>Seller / Creator</span>
            </div>
            <span class="text-[10px] opacity-80 font-normal">Multi-Vendor Storefront</span>
          </button>
        </div>
      </div>

      <!-- Full Name -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-on-surface-variant">Full Legal Name</label>
        <div class="relative flex items-center">
          <input 
            type="text" 
            required
            placeholder="Alex Mercer"
            [ngModel]="name()" 
            (ngModelChange)="name.set($event)"
            name="name"
            class="w-full rounded-xl border border-outline-variant/30 bg-surface-container-low py-3 pl-11 pr-4 text-xs text-on-surface focus:border-primary focus:bg-surface-container focus:outline-none transition-colors"
          />
          <lucide-icon [img]="UserIcon" class="absolute left-3.5 h-4 w-4 text-on-surface-variant"></lucide-icon>
        </div>
      </div>

      <!-- Email Address -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-on-surface-variant">Email Address</label>
        <div class="relative flex items-center">
          <input 
            type="email" 
            required
            placeholder="alex@nexus.io"
            [ngModel]="email()" 
            (ngModelChange)="email.set($event)"
            name="email"
            class="w-full rounded-xl border border-outline-variant/30 bg-surface-container-low py-3 pl-11 pr-4 text-xs text-on-surface focus:border-primary focus:bg-surface-container focus:outline-none transition-colors"
          />
          <lucide-icon [img]="MailIcon" class="absolute left-3.5 h-4 w-4 text-on-surface-variant"></lucide-icon>
        </div>
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-on-surface-variant">Password</label>
        <div class="relative flex items-center">
          <input 
            type="password" 
            required
            placeholder="••••••••••••"
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)"
            name="password"
            class="w-full rounded-xl border border-outline-variant/30 bg-surface-container-low py-3 pl-11 pr-4 text-xs text-on-surface font-mono focus:border-primary focus:bg-surface-container focus:outline-none transition-colors"
          />
          <lucide-icon [img]="LockIcon" class="absolute left-3.5 h-4 w-4 text-on-surface-variant"></lucide-icon>
        </div>
        <span class="text-[10px] text-on-surface-variant">Must be at least 8 characters with bcrypt salt security</span>
      </div>

      <!-- Submit Action -->
      <button 
        type="submit" 
        [disabled]="loading() || !email() || !password()"
        class="mt-2 flex w-full items-center justify-center gap-2 rounded-2xl bg-primary py-3.5 text-xs font-bold text-on-primary shadow-xl ambient-shadow-primary transition-all hover:scale-[1.01] active:scale-95 disabled:opacity-50 cursor-pointer"
      >
        <span>{{ loading() ? 'Creating Secure Account...' : 'Get Started with Nexus' }}</span>
        <lucide-icon [img]="ArrowRightIcon" class="h-4 w-4"></lucide-icon>
      </button>

    </form>

    <!-- Trust Checkmarks -->
    <div class="grid grid-cols-2 gap-2 border-t border-outline-variant/15 pt-4 text-[11px] text-on-surface-variant">
      <div class="flex items-center gap-1.5">
        <lucide-icon [img]="CheckIcon" class="h-3.5 w-3.5 text-tertiary"></lucide-icon>
        <span>Instant Access</span>
      </div>
      <div class="flex items-center gap-1.5">
        <lucide-icon [img]="CheckIcon" class="h-3.5 w-3.5 text-tertiary"></lucide-icon>
        <span>Zero Hidden Fees</span>
      </div>
    </div>

    <!-- Footer Switch -->
    <div class="text-center text-xs text-on-surface-variant">
      <span>Already have a Nexus account?</span>
      <a routerLink="/auth/login" class="font-bold text-primary hover:underline ml-1">Sign In</a>
    </div>

  </div>

</div>
