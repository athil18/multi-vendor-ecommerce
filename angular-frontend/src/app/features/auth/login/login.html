<div class="relative min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-md glass-panel-luxury p-8 sm:p-10 rounded-3xl border border-white/10 shadow-2xl relative z-10 flex flex-col gap-6">
    
    <!-- Header -->
    <div class="flex flex-col items-center text-center gap-2">
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-tr from-primary to-primary-container text-on-primary shadow-lg font-geist font-bold text-lg">
        N
      </div>
      <h1 class="font-geist text-2xl font-bold text-on-surface">Welcome to Nexus</h1>
      <p class="text-xs text-on-surface-variant">Sign in to track orders, manage your cart, and access merchant controls.</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage()" class="rounded-xl bg-error/10 border border-error/20 p-3 text-xs text-error">
      {{ errorMessage() }}
    </div>

    <!-- Login Form -->
    <form (submit)="handleLogin(); $event.preventDefault()" class="flex flex-col gap-4">
      
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-on-surface-variant">Email Address</label>
        <div class="relative flex items-center">
          <input 
            type="email" 
            required
            [ngModel]="email()" 
            (ngModelChange)="email.set($event)"
            name="email"
            class="w-full rounded-xl border border-outline-variant/30 bg-surface-container-low py-2.5 pl-10 pr-4 text-xs text-on-surface focus:border-primary focus:outline-none"
          />
          <lucide-icon [img]="MailIcon" class="absolute left-3.5 h-4 w-4 text-on-surface-variant"></lucide-icon>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-xs font-medium text-on-surface-variant">Password</label>
          <span class="text-[10px] text-primary cursor-pointer hover:underline">Forgot?</span>
        </div>
        <div class="relative flex items-center">
          <input 
            type="password" 
            required
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)"
            name="password"
            class="w-full rounded-xl border border-outline-variant/30 bg-surface-container-low py-2.5 pl-10 pr-4 text-xs text-on-surface focus:border-primary focus:outline-none"
          />
          <lucide-icon [img]="LockIcon" class="absolute left-3.5 h-4 w-4 text-on-surface-variant"></lucide-icon>
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="loading()"
        class="mt-2 flex w-full items-center justify-center gap-2 rounded-xl bg-primary py-3 text-xs font-bold text-on-primary shadow-lg ambient-shadow-primary transition-all hover:scale-[1.02] disabled:opacity-50"
      >
        <span>{{ loading() ? 'Authenticating...' : 'Sign In to Nexus' }}</span>
        <lucide-icon [img]="ArrowRightIcon" class="h-4 w-4"></lucide-icon>
      </button>

    </form>

    <!-- Footer Switch -->
    <div class="border-t border-outline-variant/15 pt-4 text-center text-xs text-on-surface-variant">
      <span>Don't have an account?</span>
      <a routerLink="/auth/register" class="font-bold text-primary hover:underline ml-1">Create Account</a>
    </div>

  </div>

</div>
