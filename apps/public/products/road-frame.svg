<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="carbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="shadowFrame" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgFrame)"/>
  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="460" rx="260" ry="25" fill="#000000" opacity="0.7"/>

  <g transform="translate(150, 140)" filter="url(#shadowFrame)">
    <!-- Main Triangle -->
    <path d="M 60,240 L 220,240 L 420,70 L 160,70 Z" fill="none" stroke="url(#carbonGradient)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Seat Stays & Fork -->
    <path d="M 60,240 L 220,70" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
    <path d="M 420,70 L 460,240" fill="none" stroke="url(#carbonGradient)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Chain Stays -->
    <path d="M 60,240 L 220,240" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>

    <!-- Bottom Bracket & Headset details -->
    <circle cx="220" cy="240" r="18" fill="#1e293b" stroke="#e11d48" stroke-width="4"/>
    <circle cx="420" cy="70" r="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="60" cy="240" r="12" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="460" cy="240" r="12" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  </g>

  <text x="400" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fecdd3" letter-spacing="4">AEROPRO CARBON ROAD FRAME</text>
  <text x="400" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#fb7185" letter-spacing="2">TORAY T1100 CARBON • MONOCOQUE • UCI CERTIFIED</text>
</svg>
