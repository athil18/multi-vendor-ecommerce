<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="padBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="oledGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="padShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <g transform="translate(250, 120)" filter="url(#padShadow)">
    <!-- Chassis Outer -->
    <rect x="0" y="0" width="300" height="340" rx="28" fill="url(#padBody)" stroke="#374151" stroke-width="2"/>
    <!-- Inner Recess -->
    <rect x="18" y="18" width="264" height="304" rx="18" fill="#030712" stroke="#1f2937" stroke-width="1"/>

    <!-- OLED Display -->
    <rect x="36" y="36" width="130" height="60" rx="8" fill="#080e1a" stroke="#0e7490" stroke-width="1.5"/>
    <text x="50" y="58" font-family="monospace" font-size="10" font-weight="700" fill="#22d3ee">LAYER 01: CODE</text>
    <text x="50" y="76" font-family="monospace" font-size="9" font-weight="500" fill="#94a3b8">VOL: [■■■■□] 78%</text>

    <!-- Rotary Encoder Knob (Knurled Aluminum) -->
    <circle cx="225" cy="66" r="28" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <circle cx="225" cy="66" r="22" fill="#1e293b"/>
    <circle cx="225" cy="66" r="5" fill="#38bdf8"/>
    <!-- Indicator Line -->
    <line x1="225" y1="44" x2="225" y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- 6 Mechanical Keys (2x3 Grid) -->
    <!-- Row 1 -->
    <rect x="36" y="125" width="68" height="68" rx="12" fill="url(#keyGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="70" cy="159" r="6" fill="#ec4899"/>

    <rect x="116" y="125" width="68" height="68" rx="12" fill="url(#keyGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="150" cy="159" r="6" fill="#a855f7"/>

    <rect x="196" y="125" width="68" height="68" rx="12" fill="url(#keyGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="230" cy="159" r="6" fill="#3b82f6"/>

    <!-- Row 2 -->
    <rect x="36" y="215" width="68" height="68" rx="12" fill="url(#keyGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="70" cy="249" r="6" fill="#10b981"/>

    <rect x="116" y="215" width="68" height="68" rx="12" fill="url(#keyGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="150" cy="249" r="6" fill="#f59e0b"/>

    <rect x="196" y="215" width="68" height="68" rx="12" fill="url(#keyGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="230" cy="249" r="6" fill="#ef4444"/>
  </g>

  <text x="400" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#93c5fd" letter-spacing="4">TACTILE MACRO PAD (6-KEY)</text>
  <text x="400" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#60a5fa" letter-spacing="2">OLED DISPLAY • ROTARY ENCODER • PROGRAMMABLE FIRMWARE</text>
</svg>
