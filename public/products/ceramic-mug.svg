<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181412"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="ceramicGlaze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="30%" stop-color="#78716c"/>
      <stop offset="70%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="clayBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="mugShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="15" dy="30" stdDeviation="35" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="400" cy="420" rx="160" ry="30" fill="#000000" opacity="0.6"/>

  <g transform="translate(260, 140)" filter="url(#mugShadow)">
    <!-- Mug Handle -->
    <path d="M 190,80 C 270,80 270,220 190,220" fill="none" stroke="url(#ceramicGlaze)" stroke-width="32" stroke-linecap="round"/>
    <path d="M 190,80 C 270,80 270,220 190,220" fill="none" stroke="#292524" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- Ceramic Mug Body -->
    <path d="M 30,30 L 190,30 C 200,160 190,240 175,270 L 45,270 C 30,240 20,160 30,30 Z" fill="url(#ceramicGlaze)"/>

    <!-- Exposed Terracotta Clay Base Ring -->
    <path d="M 45,245 L 175,245 C 172,258 168,268 165,272 L 55,272 C 52,268 48,258 45,245 Z" fill="url(#clayBase)"/>

    <!-- Mug Rim & Inside Depth -->
    <ellipse cx="110" cy="30" rx="80" ry="24" fill="#292524" stroke="#57534e" stroke-width="4"/>
    <ellipse cx="110" cy="32" rx="72" ry="20" fill="#1c1917"/>
    <!-- Steam / Coffee Surface -->
    <ellipse cx="110" cy="40" rx="66" ry="16" fill="#451a03"/>
    <ellipse cx="110" cy="40" rx="60" ry="14" fill="#3f1a05" opacity="0.8"/>
  </g>

  <text x="400" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#d6d3d1" letter-spacing="4">HANDCRAFTED CERAMIC STUDIO MUG</text>
  <text x="400" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#a8a29e" letter-spacing="2">VOLCANIC STONEWARE • WHEEL-THROWN • MATTE FINISH</text>
</svg>
